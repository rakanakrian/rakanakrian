<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAKANAKRIAN</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef5ff;
    color: #222;
}

.header {
    background: #1976d2;
    color: white;
    text-align: center;
    padding: 30px 15px;
    border-radius: 0 0 20px 20px;
}

.header h1 {
    font-size: 34px;
    margin: 0 0 25px;
}

.header p {
    font-size: 22px;
    margin: 5px;
}

.header small {
    font-size: 17px;
}

.container {
    max-width: 750px;
    margin: auto;
    padding: 20px;
}

.section-title {
    color: #28699f;
    font-size: 25px;
    font-weight: bold;
    margin: 5px 0 15px;
}

.packages {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 3px 10px #00000008;
}

.card h2 {
    margin: 5px 0 20px;
    font-size: 23px;
}

.price {
    color: #2879b9;
    font-size: 27px;
    font-weight: bold;
    margin-bottom: 15px;
}

.duration {
    color: #777;
    font-size: 18px;
    margin-bottom: 20px;
}

button {
    background: #1976d2;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 13px;
    width: 100%;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #125da8;
}

.cart-title {
    font-size: 25px;
    color: #28699f;
    font-weight: bold;
    margin: 25px 0 15px;
}

.cart {
    background: white;
    border-radius: 20px;
    padding: 20px;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
}

.total {
    background: white;
    border-radius: 20px;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    font-size: 25px;
    margin-top: 15px;
}

.total-price {
    color: #2879b9;
    font-weight: bold;
}

.checkout {
    margin-top: 20px;
}

@media(max-width: 400px) {
    .packages {
        gap: 10px;
    }

    .card {
        padding: 15px;
    }

    .card h2 {
        font-size: 20px;
    }

    .price {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>RAKANAKRIAN</h1>
    <p>ร้านจำหน่ายแพ็กเกจออนไลน์</p>
    <small>เลือกได้หลายแพ็กเกจในคำสั่งซื้อเดียว</small>
</div>

<div class="container">

    <div class="section-title">
        แพ็กเกจแนะนำ
    </div>

    <div class="packages">

        <div class="card">
            <h2>NETFLIX
                มือถือ ไอแพด แล็ปท็อป</h2>
            <div class="price">120 บาท</div>
            <div class="duration"> 1 เดือน</div>

            <button onclick="addCart('Basic', 120)">
                เพิ่มลงตะกร้า
            </button>
        </div>

        <div class="card">
            <h2>NETFLIX TV</h2>
            <div class="price">160 บาท</div>
            <div class="duration"> 1 เดือน</div>

            <button onclick="addCart('TV', 160)">
                เพิ่มลงตะกร้า
            </button>
        </div>

    </div>

    <div class="cart-title">
        🛒 ตะกร้าสินค้า
    </div>

    <div class="cart" id="cart">
        <p style="color:#999;text-align:center;">
            ยังไม่มีสินค้าในตะกร้า
        </p>
    </div>

    <div class="total">
        <span>ยอดรวม</span>
        <span class="total-price" id="total">0 บาท</span>
    </div>

    <div class="checkout">
        <button onclick="checkout()">
            สั่งซื้อสินค้า
        </button>
    </div>

</div>

<script>

let cart = [];

function addCart(name, price) {

    cart.push({
        name: name,
        price: price
    });

    renderCart();

}

function renderCart() {

    let cartElement = document.getElementById("cart");
    let totalElement = document.getElementById("total");

    cartElement.innerHTML = "";

    let total = 0;

    if (cart.length === 0) {
        cartElement.innerHTML =
        '<p style="color:#999;text-align:center;">ยังไม่มีสินค้าในตะกร้า</p>';
    }

    cart.forEach((item, index) => {

        total += item.price;

        cartElement.innerHTML += `
            <div class="cart-item">
                <span>${item.name}</span>
                <span>
                    ${item.price} บาท
                    <span onclick="removeCart(${index})"
                    style="color:red;cursor:pointer;"> ✕ </span>
                </span>
            </div>
        `;

    });

    totalElement.innerText = total.toLocaleString() + " บาท";

}

function removeCart(index) {

    cart.splice(index, 1);
    renderCart();

}

function checkout() {

    if (cart.length === 0) {
        alert("กรุณาเลือกแพ็กเกจก่อนครับ");
        return;
    }

    alert("ขอบคุณที่สั่งซื้อสินค้า ยอดรวม " +
    document.getElementById("total").innerText);

}

</script>

</body>
</html>
